[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=68.2.2",
  "wheel>=0.41.2",
]

[project]
name = "chronosnet"
version = "1.0.0"
description = "Deep Neural Time-Series & AR-Net Hybrid Interpretable Forecasting Framework"
readme = "README.md"
authors = [
  { name = "Sarthak Mun", email = "sarthak.mun03@gmail.com" },
]
keywords = [
  "time-series",
  "forecasting",
  "neuralprophet",
  "ar-net",
  "pytorch",
  "deep-learning",
  "trend-decomposition",
  "seasonality",
  "uncertainty-quantification",
]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "torch>=2.0.0",
  "pytorch-lightning>=2.0.0",
  "tensorboard>=2.11.0",
  "torchmetrics>=1.0.0",
  "typing-extensions>=4.5.0",
  "holidays>=0.30",
  "matplotlib>=3.5.0",
  "plotly>=5.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
chronosnet = "chronosnet.__main__:main"

[tool.setuptools.packages.find]
include = ["chronosnet*", "neuralprophet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
